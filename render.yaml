services:
  - type: web
    name: business-bricks-customer-approval
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: business-bricks-db
          property: connectionString
      - key: EMAIL_VERIFICATION_SECRET
        generateValue: true
      - key: SHOPIFY_STORE_DOMAIN
        value: promo.businessbricks.com
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: SHOPIFY_WEBHOOK_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: Business Bricks <b2b@businessbricks.com>
